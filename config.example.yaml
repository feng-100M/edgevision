input:
  type: video
  path: data/videos/vtest.avi
  device: /dev/video0
  width: 640
  height: 480
  fps: 20
  retry_seconds: 1.0
  focus_warmup_frames: 30
  min_sharpness: 40.0
  rotation: 0  # Clockwise; use 180 for an upside-down camera. Applied before inference.
  mirror_horizontal: false  # Flip left/right after rotation, before inference.
model:
  path: models/yolox_nano.onnx
  threads: 2
  confidence: 0.35
  nms: 0.45
  motion_assist_rotation: null  # Optional fixed-camera second pass, clockwise degrees.
roi:
  name: restricted
  enabled: true
  points: [[0.4, 0.1], [0.95, 0.1], [0.95, 0.95], [0.4, 0.95]]
events:
  cooldown_seconds: 2.0
  emit_leave: true
  confirmation_confidence: 0.70  # Minimum person score on the confirming observation.
output:
  directory: output
  max_bytes: 209715200
  retention_days: 7
  min_free_bytes: 104857600
mqtt:
  enabled: true
  host: 127.0.0.1
  port: 1883
  topic: edgevision/alerts

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EdgeVision · 人员检测</title>
<style>
:root{color-scheme:dark;--bg:#101619;--panel:#192125;--line:#354044;--text:#eff3ef;--muted:#b3c0bc;--mint:#8bdec2;--amber:#ffba82}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Inter","Microsoft YaHei",system-ui,sans-serif}
main{max-width:1192px;margin:auto;padding:24px}
h1,h2,h3,p,dl,dd{margin:0}
h1{font-size:clamp(23px,3vw,32px);letter-spacing:-.035em}
h2{font-size:20px}h3{font-size:17px}
header,.row,.actions,.legend,.section-head,.reading{display:flex;align-items:center;gap:14px}
header,.section-head,.reading{justify-content:space-between}
header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:20px}
.actions,.legend{flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid #596965;color:var(--text);background:transparent;border-radius:6px;padding:5px 12px}
button:hover,button[aria-pressed=true]{border-color:var(--mint);color:var(--mint)}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
button:disabled{opacity:.6;cursor:wait}a{color:var(--mint)}
.stop{border-color:#805656;color:#ffc4bb}
.status{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.good{color:var(--mint)}.warn,.bad{color:var(--amber)}.muted,dt,.legend,th{color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr);gap:16px;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px}
.video-panel,.side{display:flex;flex-direction:column;gap:14px}
.side .panel:last-child{flex:1}
.video{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#080d0e;border-radius:5px}
.legend{gap:16px}.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;margin-top:12px}
.stat b{display:block;font:600 clamp(28px,3vw,40px)/1.1 "Inter",system-ui,sans-serif;font-variant-numeric:tabular-nums;margin-top:4px}
.stat:first-child b{color:var(--mint)}
.latest{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.latest img{width:100px;height:64px;object-fit:cover;border-radius:4px}
.latest strong{font-size:21px;display:block}.latest time{display:block;color:var(--muted)}
#storage,#mqtt-detail{color:var(--amber)}#storage:empty,#mqtt-detail:empty{display:none}
.records,details.panel{margin-top:16px}.section-head{gap:10px;flex-wrap:wrap}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500}.thumb{display:block;width:66px;height:42px;object-fit:cover;border-radius:4px}
.empty{padding:14px 0;color:var(--muted)}summary{cursor:pointer;font-weight:600}
.diag{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:24px;margin:16px 0 4px}
.reading{gap:8px;margin-top:6px;align-items:baseline}.reading dd{overflow-wrap:anywhere;text-align:right}
.track{margin-top:8px}.trend{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 12px;max-width:460px;margin:12px 0}
meter{width:100%;height:18px;accent-color:var(--mint)}.trend b{font-variant-numeric:tabular-nums}
@media(max-width:760px){main{padding:14px}.layout{grid-template-columns:1fr}.panel{padding:14px}header{align-items:flex-start;flex-direction:column;gap:8px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stats dt{font-size:14px}.video{aspect-ratio:4/3}.actions{gap:8px}.records .section-head{align-items:flex-start}.diag{gap:16px}}
</style>
</head>
<body><main>
<header><h1 id="page-title">EdgeVision · 区域检测</h1><div class="actions"><span id="connection" class="status" role="status">等待画面</span><button id="stop" class="stop">停止检测</button></div></header>
<div class="layout">
<section class="panel video-panel">
  <div class="section-head"><h2>实时画面</h2><span id="roi" class="muted"></span></div>
  <img id="frame" class="video" src="/stream.mjpg" alt="摄像头画面与人员检测框">
  <div class="legend"><span id="roi-legend"><i class="dot" style="background:#407cdc"></i>检测区域</span><span id="outside-legend"><i class="dot" style="background:#46dc64"></i>区域外</span><span><i class="dot" style="background:#ff5a00"></i><span id="inside-legend">区域内</span></span></div>
</section>
<aside class="side">
  <section class="panel"><div class="section-head"><h2>检测概况</h2><span class="muted"><b id="fps">—</b> FPS</span></div>
    <dl class="stats"><div class="stat"><dt>当前人数</dt><dd><b id="people">—</b></dd></div><div id="inside-stat" class="stat"><dt>区域内</dt><dd><b id="inside">—</b></dd></div><div class="stat"><dt>本次事件</dt><dd><b id="count">—</b></dd></div><div class="stat"><dt>代理确认</dt><dd><b id="mqtt-acknowledged">—</b></dd></div></dl>
  </section>
  <section class="panel"><div class="section-head"><h2>最新事件</h2><span id="mqtt-state" class="status">MQTT 等待中</span></div><div id="latest" class="latest">暂无事件</div><p id="storage" role="alert"></p><p id="mqtt-detail" role="status"></p></section>
</aside></div>
<section class="panel records"><div class="section-head"><h2 id="records-title">本次事件</h2><div class="actions"><button id="show-live" aria-pressed="true">实时</button><button id="load-history" aria-label="已保存的历史事件" aria-pressed="false">历史</button><button id="refresh-history" hidden>刷新</button></div></div>
  <p id="history-scope" class="muted" hidden></p>
  <div id="history-chart" class="trend" hidden>
    <label for="entered-meter">进入</label><meter id="entered-meter" min="0" max="1" value="0"></meter><b id="entered-count">0</b>
    <label for="left-meter">离开</label><meter id="left-meter" min="0" max="1" value="0"></meter><b id="left-count">0</b>
  </div>
  <div id="events" class="tablewrap"><p class="empty">暂无事件</p></div><div id="history" class="tablewrap" hidden></div>
</section>
<details class="panel"><summary>运行诊断</summary><div class="diag">
<section><h3>画面与性能</h3><dl>
<div class="reading"><dt>最近成功（北京时间）</dt><dd id="last-success">—</dd></div><div class="reading"><dt>连续失败</dt><dd id="failures">—</dd></div><div class="reading"><dt>上次恢复</dt><dd id="last-recovery">—</dd></div>
<div class="reading"><dt>处理帧 / 预览 FPS</dt><dd><span id="frames">—</span> / <span id="preview-fps">—</span></dd></div><div class="reading"><dt>丢帧率 / 帧龄 p95</dt><dd><span id="drops">—</span> / <span id="latency">—</span></dd></div><div class="reading"><dt>模糊跳过截图</dt><dd id="focus-rejected">—</dd></div></dl></section>
<section><h3>MQTT 告警通道</h3><dl><div class="reading"><dt>Broker</dt><dd id="mqtt-target">—</dd></div><div class="reading"><dt>主题</dt><dd id="mqtt-topic">—</dd></div><div class="reading"><dt>提交 / 在途 / 失败</dt><dd><span id="mqtt-accepted">0</span> / <span id="mqtt-pending">0</span> / <span id="mqtt-failed">0</span></dd></div></dl></section>
<section><h3>轨迹判定</h3><div id="tracks">等待首帧</div></section>
</div></details></main><script src="/dashboard.js"></script></body></html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgevision"
version = "0.2.0"
description = "Offline Raspberry Pi UVC person intrusion detection"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4", "opencv-python-headless==4.11.0.86",
  "onnxruntime==1.20.1", "PyYAML==6.0.2",
  "paho-mqtt==2.1.0", "psutil==6.1.1"
]
[project.optional-dependencies]
dev = ["pytest==8.3.5"]
model_tools = ["onnx==1.17.0"]
[project.scripts]
edgevision = "edgevision.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
edgevision = ["*.html", "*.js"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
